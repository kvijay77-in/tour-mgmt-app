name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - App.tsx
      - app.config.ts
      - app.json
      - babel.config.js
      - metro.config.js
      - index.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**
      - assets/**
      - infra/**
      - tools/web-deploy.mjs
      - tools/web-deploy.test.mjs
      - tools/web-release.mjs
      - tools/web-release.test.mjs
      - tools/web-export-check.mjs
      - tools/web-export-check.test.mjs
      - tools/web-deployment-toolchain.json
      - tools/web-deployment.example.json
      - Makefile
      - samconfig.toml
      - .github/workflows/deploy-web.yml
      - .github/workflows/rollback-web.yml
      - .github/workflows/recover-web-lock.yml
  workflow_dispatch:
    inputs:
      target:
        description: Dev publication or Production infrastructure bootstrap
        required: true
        type: choice
        options: [dev, prod-infrastructure]
        default: dev
      source_ref:
        description: Developer-trusted source ref to export for Dev
        required: false
        type: string
        default: main

permissions: {}

concurrency:
  group: web-${{ (github.event_name == 'push' || inputs.target == 'prod-infrastructure') && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name == 'push' && vars.WEB_PRODUCTION_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'web-prod' || 'web-dev' }}
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'prod' || 'dev' }}
      SOURCE_REF: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out selected application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
          path: selected-source
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Build and validate isolated source
        id: release
        working-directory: trusted
        env:
          SOURCE_REPOSITORY: ${{ github.workspace }}/selected-source
        run: |
          source_sha="$(git -C "$SOURCE_REPOSITORY" rev-parse HEAD)"
          release_id="${DEPLOY_ENV}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${source_sha:0:12}"
          node tools/web-deploy.mjs build --env "$DEPLOY_ENV" --source-ref HEAD --source-repo "$SOURCE_REPOSITORY" --release-id "$release_id" --config-env-vars
          echo "environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Archive exact release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-${{ steps.release.outputs.environment }}-${{ github.run_id }}
          path: trusted/.web-releases/${{ steps.release.outputs.environment }}/${{ steps.release.outputs.release_id }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  acquire-lock:
    needs: [build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      lock_owner: ${{ steps.acquire.outputs.lock_owner }}
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_PUBLISHER_ROLE_ARN: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Assume exact publisher role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ needs.build.outputs.environment }}-lock
      - name: Acquire cross-process deployment lease
        id: acquire
        run: |
          result="$(node tools/web-deploy.mjs lock-acquire --env "$DEPLOY_ENV" --config-env-vars --bucket-name "$AWS_S3_BUCKET" --publisher-role-arn "$AWS_PUBLISHER_ROLE_ARN" --source-sha "${{ needs.build.outputs.source_sha }}")"
          echo "lock_owner=$(printf '%s' "$result" | jq -r .owner)" >> "$GITHUB_OUTPUT"

  infrastructure:
    needs: [build, acquire-lock]
    if: needs.build.result == 'success' && needs.acquire-lock.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      bucket_name: ${{ steps.outputs.outputs.bucket_name }}
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
      site_url: ${{ steps.outputs.outputs.site_url }}
      publisher_role_arn: ${{ steps.outputs.outputs.publisher_role_arn }}
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN }}
      AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted infrastructure code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Set up pinned AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17
        with:
          version: 1.166.2
      - name: Assume exact infrastructure role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ needs.build.outputs.environment }}-infra
      - name: Reconcile hosting and publisher stacks
        run: node tools/web-deploy.mjs deploy --env "$DEPLOY_ENV" --stage infrastructure --config-env-vars --outputs-file "$RUNNER_TEMP/hosting-outputs.json"
      - name: Export generated hosting outputs
        id: outputs
        run: |
          echo "bucket_name=$(jq -r .bucketName "$RUNNER_TEMP/hosting-outputs.json")" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(jq -r .distributionId "$RUNNER_TEMP/hosting-outputs.json")" >> "$GITHUB_OUTPUT"
          echo "site_url=$(jq -r .siteUrl "$RUNNER_TEMP/hosting-outputs.json")" >> "$GITHUB_OUTPUT"
          echo "publisher_role_arn=$(jq -r .publisherRoleArn "$RUNNER_TEMP/hosting-outputs.json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, acquire-lock, infrastructure]
    if: needs.build.result == 'success' && needs.acquire-lock.result == 'success' && needs.infrastructure.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_S3_BUCKET: ${{ needs.infrastructure.outputs.bucket_name }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ needs.infrastructure.outputs.distribution_id }}
      AWS_SITE_URL: ${{ needs.infrastructure.outputs.site_url }}
      AWS_PUBLISHER_ROLE_ARN: ${{ needs.infrastructure.outputs.publisher_role_arn }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted publisher code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Download validated release
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: web-${{ needs.build.outputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Assume exact publisher role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ needs.infrastructure.outputs.publisher_role_arn }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ needs.build.outputs.environment }}-publish
      - name: Publish exact validated artifact
        run: >-
          node tools/web-deploy.mjs publish
          --env "$DEPLOY_ENV"
          --config-env-vars
          --artifact-dir "$RUNNER_TEMP/release"
          --bucket-name "$AWS_S3_BUCKET"
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID"
          --site-url "$AWS_SITE_URL"
          --publisher-role-arn "$AWS_PUBLISHER_ROLE_ARN"
          --lock-owner "${{ needs.acquire-lock.outputs.lock_owner }}"

  production-infrastructure:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod-infrastructure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: web-prod
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: prod
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN }}
      AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted main infrastructure code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Set up pinned AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17
        with:
          version: 1.166.2
      - name: Assume exact Production infrastructure role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-prod-infra-bootstrap
      - name: Reconcile Production hosting only
        run: node tools/web-deploy.mjs deploy --env prod --stage infrastructure --config-env-vars --outputs-file "$RUNNER_TEMP/production-hosting-outputs.json"

  release-lock:
    needs: [build, acquire-lock, infrastructure, publish]
    if: always() && needs.acquire-lock.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_PUBLISHER_ROLE_ARN: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
    steps:
      - name: Check out trusted cleanup code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Assume exact publisher role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ needs.build.outputs.environment }}-unlock
      - name: Release this run's lease only
        run: node tools/web-deploy.mjs lock-release --env "$DEPLOY_ENV" --config-env-vars --bucket-name "$AWS_S3_BUCKET" --publisher-role-arn "$AWS_PUBLISHER_ROLE_ARN" --lock-owner "${{ needs.acquire-lock.outputs.lock_owner }}"