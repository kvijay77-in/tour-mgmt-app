name: Roll back web release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]
      run_id:
        description: Successful Deploy web run that owns the retained artifact
        required: true
        type: string

permissions: {}

concurrency:
  group: web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      release_id: ${{ steps.verify.outputs.release_id }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      TARGET_RUN_ID: ${{ inputs.run_id }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted main recovery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Download requested release artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: web-${{ inputs.environment }}-${{ inputs.run_id }}
          path: ${{ runner.temp }}/source-release
      - name: Verify original run and manifest before AWS access
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must contain only digits" >&2; exit 1; }
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-web.yml" > "$RUNNER_TEMP/deploy-workflow.json"
          node --input-type=module - "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/deploy-workflow.json" "$GITHUB_REPOSITORY" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [runPath, workflowPath, repository] = process.argv.slice(2);
          const run = JSON.parse(await readFile(runPath, 'utf8'));
          const workflow = JSON.parse(await readFile(workflowPath, 'utf8'));
          if (run.workflow_id !== workflow.id || run.head_branch !== 'main' || run.head_repository?.full_name !== repository || run.status !== 'completed' || run.conclusion !== 'success' || !['push', 'workflow_dispatch'].includes(run.event)) {
            throw new Error('Requested artifact is not from a successful trusted-main Deploy web workflow run');
          }
          process.stdout.write(`${run.head_sha}\n`);
          NODE
          expected_workflow_sha="$(node --input-type=module - "$RUNNER_TEMP/source-run.json" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const run = JSON.parse(await readFile(process.argv[2], 'utf8'));
          process.stdout.write(run.head_sha);
          NODE
          )"
          verified="$(node tools/web-deploy.mjs verify-artifact --env "$DEPLOY_ENV" --config-env-vars --allow-prior-config --artifact-dir "$RUNNER_TEMP/source-release" --workflow-sha "$expected_workflow_sha")"
          echo "source_sha=$(printf '%s' "$verified" | jq -r .sourceSha)" >> "$GITHUB_OUTPUT"
          echo "release_id=$(printf '%s' "$verified" | jq -r .releaseId)" >> "$GITHUB_OUTPUT"
      - name: Re-archive only the verified bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-web-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source-release/
          if-no-files-found: error
          retention-days: 1

  acquire-lock:
    needs: [verify-artifact]
    if: needs.verify-artifact.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      lock_owner: ${{ steps.acquire.outputs.lock_owner }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_PUBLISHER_ROLE_ARN: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
    steps:
      - name: Check out trusted main recovery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Assume exact publisher role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ inputs.environment }}-rollback-lock
      - name: Acquire rollback lease
        id: acquire
        run: |
          result="$(node tools/web-deploy.mjs lock-acquire --env "$DEPLOY_ENV" --config-env-vars --bucket-name "$AWS_S3_BUCKET" --publisher-role-arn "$AWS_PUBLISHER_ROLE_ARN" --source-sha "${{ needs.verify-artifact.outputs.source_sha }}")"
          echo "lock_owner=$(printf '%s' "$result" | jq -r .owner)" >> "$GITHUB_OUTPUT"

  rollback:
    needs: [verify-artifact, acquire-lock]
    if: needs.verify-artifact.result == 'success' && needs.acquire-lock.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_OUTPUT_KEY }}
      AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY: ${{ vars.AWS_BACKEND_USER_POOL_CLIENT_OUTPUT_KEY }}
      AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY: ${{ vars.AWS_BACKEND_IDENTITY_POOL_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_SITE_URL: ${{ vars.AWS_SITE_URL }}
      AWS_PUBLISHER_ROLE_ARN: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      WEB_READINESS_API_URL: ${{ vars.WEB_READINESS_API_URL }}
      WEB_READINESS_ARTIFACT_URL: ${{ vars.WEB_READINESS_ARTIFACT_URL }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_USE_MOCK_DATA: ${{ vars.EXPO_PUBLIC_USE_MOCK_DATA }}
      EXPO_PUBLIC_QR_DEV_FORMAT: ${{ vars.EXPO_PUBLIC_QR_DEV_FORMAT }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - name: Check out trusted main recovery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Download verified release
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: verified-web-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Assume exact publisher role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ inputs.environment }}-rollback
      - name: Restore exact retained bytes
        run: >-
          node tools/web-deploy.mjs publish
          --env "$DEPLOY_ENV"
          --config-env-vars
          --allow-prior-config
          --artifact-dir "$RUNNER_TEMP/release"
          --bucket-name "$AWS_S3_BUCKET"
          --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID"
          --site-url "$AWS_SITE_URL"
          --publisher-role-arn "$AWS_PUBLISHER_ROLE_ARN"
          --lock-owner "${{ needs.acquire-lock.outputs.lock_owner }}"
          --allow-prior-config

  release-lock:
    needs: [verify-artifact, acquire-lock, rollback]
    if: always() && needs.acquire-lock.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'web-prod' || 'web-dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BACKEND_PROJECT: ${{ vars.AWS_BACKEND_PROJECT }}
      AWS_BACKEND_STACK_NAME: ${{ vars.AWS_BACKEND_STACK_NAME }}
      AWS_BACKEND_REGION: ${{ vars.AWS_BACKEND_REGION }}
      AWS_BACKEND_API_OUTPUT_KEY: ${{ vars.AWS_BACKEND_API_OUTPUT_KEY }}
      AWS_BOOTSTRAP_STACK_NAME: ${{ vars.AWS_BOOTSTRAP_STACK_NAME }}
      AWS_HOSTING_STACK_NAME: ${{ vars.AWS_HOSTING_STACK_NAME }}
      AWS_PUBLISHER_STACK_NAME: ${{ vars.AWS_PUBLISHER_STACK_NAME }}
      AWS_PROJECT: ${{ vars.AWS_PROJECT }}
      AWS_OWNER: ${{ vars.AWS_OWNER }}
      AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN: ${{ vars.AWS_LOCAL_DEPLOYMENT_PRINCIPAL_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_PUBLISHER_ROLE_ARN: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
      WEB_GITHUB_OWNER: ${{ vars.WEB_GITHUB_OWNER }}
      WEB_GITHUB_REPOSITORY: ${{ vars.WEB_GITHUB_REPOSITORY }}
      WEB_CSP_MODE: ${{ vars.WEB_CSP_MODE }}
      WEB_CONTENT_SECURITY_POLICY: ${{ vars.WEB_CONTENT_SECURITY_POLICY }}
      WEB_PRODUCTION_REVIEWERS: ${{ vars.WEB_PRODUCTION_REVIEWERS }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
    steps:
      - name: Check out trusted recovery cleanup code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Assume exact publisher role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          role-session-name: web-${{ inputs.environment }}-rollback-unlock
      - name: Release this recovery run's lease only
        run: node tools/web-deploy.mjs lock-release --env "$DEPLOY_ENV" --config-env-vars --bucket-name "$AWS_S3_BUCKET" --publisher-role-arn "$AWS_PUBLISHER_ROLE_ARN" --lock-owner "${{ needs.acquire-lock.outputs.lock_owner }}"