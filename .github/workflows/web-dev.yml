name: Web Dev

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tools/web.sh'
      - '.github/workflows/web-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_AWS_ACCOUNT_ID: ${{ vars.WEB_AWS_ACCOUNT_ID }}
      WEB_AWS_REGION: ${{ vars.WEB_AWS_REGION }}
      WEB_STACK_NAME: ${{ vars.WEB_STACK_NAME }}
      APP_VARIANT: ${{ vars.APP_VARIANT }}
      EXPO_PUBLIC_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_ENVIRONMENT }}
      EXPO_PUBLIC_LOG_LEVEL: ${{ vars.EXPO_PUBLIC_LOG_LEVEL }}
      EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
      EXPO_PUBLIC_AWS_USER_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_ID }}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID }}
      EXPO_PUBLIC_AWS_IDENTITY_POOL_ID: ${{ vars.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
      EXPO_PUBLIC_TOUR_DATA_API_BASE_URL: ${{ vars.EXPO_PUBLIC_TOUR_DATA_API_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.WEB_DEV_ROLE_ARN }}
          aws-region: ${{ vars.WEB_AWS_REGION }}

      - run: bash tools/web.sh publish --env dev
