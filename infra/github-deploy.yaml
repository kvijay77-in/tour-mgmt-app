AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Scoped GitHub infrastructure role, CloudFormation execution role, and publisher permission boundary.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  GitHubOwner:
    Type: String
    MinLength: 1
  GitHubRepository:
    Type: String
    MinLength: 1
  Project:
    Type: String
    MinLength: 1
  Owner:
    Type: String
    MinLength: 1
  HostingStackName:
    Type: String
    MinLength: 1
  PublisherStackName:
    Type: String
    MinLength: 1
  BackendStackName:
    Type: String
    MinLength: 1
  BackendRegion:
    Type: String
    MinLength: 1
  WebBucketName:
    Type: String
    MinLength: 3
  LocalDeploymentPrincipalArn:
    Type: String
    MinLength: 1
  ExistingOidcProviderArn:
    Type: String
    Default: ""
  OidcProviderOwner:
    Type: String
    AllowedValues: [BOOTSTRAP, EXTERNAL, PUBLISHER]

Conditions:
  CreateOidcProvider: !Equals [!Ref OidcProviderOwner, BOOTSTRAP]
  IsDev: !Equals [!Ref Environment, dev]

Resources:
  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation

  PublisherPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Project}-web-publisher-boundary-${Environment}"
      Description: Limits the publisher role to this environment's exact bucket and tagged distribution.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ExactWebBucketReadWrite
            Effect: Allow
            Action: [s3:GetBucketLocation, s3:ListBucket]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}"
          - Sid: ExactWebObjectsReadWrite
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/*"
          - Sid: ExactDeploymentLease
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/.web-deploy-lock"
          - Sid: DenyUnconditionalLeaseOverwrite
            Effect: Deny
            Action: [s3:PutObject]
            Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/.web-deploy-lock"
            Condition:
              StringNotEquals:
                s3:if-none-match: "*"
          - Sid: ProjectDistributionInvalidationAndStatus
            Effect: Allow
            Action: [cloudfront:CreateInvalidation, cloudfront:GetDistribution, cloudfront:GetInvalidation]
            Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Project: !Ref Project
                aws:ResourceTag/Environment: !Ref Environment

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-web-cloudformation-${Environment}"
      Description: Executes only the app-owned hosting and publisher CloudFormation changesets.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReconcileWebHostingResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ExactWebBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketOwnershipControls
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/*"
              - Sid: CloudFrontCreateAndInventory
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateCachePolicy
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:ListDistributions
                  - cloudfront:ListOriginAccessControls
                  - cloudfront:ListCachePolicies
                  - cloudfront:ListResponseHeadersPolicies
                Resource: "*"
              - Sid: InspectTagsInCloudFrontResourceNamespaces
                Effect: Allow
                Action: [cloudfront:ListTagsForResource]
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*"
              - Sid: UpdateTaggedDistributionAndPolicies
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetCachePolicy
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: !Ref Project
                    aws:ResourceTag/Environment: !Ref Environment
              - Sid: UpdateOriginAccessControlsInThisAccount
                Effect: Allow
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*"
              - Sid: TagOnlyMatchingProjectResources
                Effect: Allow
                Action: [cloudfront:TagResource]
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*"
                  - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: !Ref Project
                    aws:RequestTag/Environment: !Ref Environment
              - Sid: CreatePublisherRoleWithRequiredBoundary
                Effect: Allow
                Action: [iam:CreateRole]
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-web-publisher-${Environment}"
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref PublisherPermissionsBoundary
              - Sid: UpdateOnlyPublisherRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-web-publisher-${Environment}"
              - Sid: SetOnlyRequiredPublisherBoundary
                Effect: Allow
                Action: [iam:PutRolePermissionsBoundary]
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-web-publisher-${Environment}"
                Condition:
                  ArnEquals:
                    iam:PermissionsBoundary: !Ref PublisherPermissionsBoundary
              - Sid: CreateCloudFrontServiceLinkedRole
                Effect: Allow
                Action: [iam:CreateServiceLinkedRole]
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/cloudfront.amazonaws.com/AWSServiceRoleForCloudFront*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName: cloudfront.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation

  WebInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-web-infrastructure-${Environment}"
      Description: Reconciles only the matching app hosting and publisher stacks.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubActionsOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${GitHubOwner}/${GitHubRepository}:environment:${EnvironmentName}"
                  - EnvironmentName: !If [IsDev, web-dev, web-prod]
          - Effect: Allow
            Principal:
              AWS: !Ref LocalDeploymentPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReconcileOnlyApprovedWebStacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InspectAndProtectExactWebStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:UpdateTerminationProtection
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${HostingStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${PublisherStackName}/*"
              - Sid: ManageChangesetsForExactWebStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:ListChangeSets
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${HostingStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${PublisherStackName}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*"
                Condition:
                  StringLike:
                    cloudformation:StackId:
                      - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${HostingStackName}/*"
                      - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${PublisherStackName}/*"
              - Sid: ReadOnlyApprovedBackendStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks]
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${BackendRegion}:${AWS::AccountId}:stack/${BackendStackName}/*"
              - Sid: CoordinateOnlyOnExactDeploymentLease
                Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/.web-deploy-lock"
              - Sid: CreateLeaseOnlyWhenAbsent
                Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/.web-deploy-lock"
                Condition:
                  StringEquals:
                    s3:if-none-match: "*"
              - Sid: DenyUnconditionalLeaseOverwrite
                Effect: Deny
                Action: [s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${WebBucketName}/.web-deploy-lock"
                Condition:
                  StringNotEquals:
                    s3:if-none-match: "*"
              - Sid: InspectOidcProviderInventory
                Effect: Allow
                Action: [iam:ListOpenIDConnectProviders]
                Resource: "*"
              - Sid: InspectOnlyGitHubOidcProvider
                Effect: Allow
                Action: [iam:GetOpenIDConnectProvider]
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
              - Sid: PassOnlyDedicatedExecutionRole
                Effect: Allow
                Action: [iam:PassRole]
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: VerifyAwsIdentity
                Effect: Allow
                Action: [sts:GetCallerIdentity]
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  InfrastructureRoleArn:
    Description: Short-lived role for trusted infrastructure reconciliation.
    Value: !GetAtt WebInfrastructureRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Dedicated service role for hosting and publisher stacks.
    Value: !GetAtt CloudFormationExecutionRole.Arn
  PublisherPermissionsBoundaryArn:
    Description: Bootstrap-owned permissions boundary attached to the publisher role.
    Value: !Ref PublisherPermissionsBoundary
  OidcProviderArn:
    Description: Account provider used by the app infrastructure role.
    Value: !If [CreateOidcProvider, !Ref GitHubActionsOidcProvider, !Ref ExistingOidcProviderArn]
  OidcProviderOwner:
    Description: Stable owner mode; reruns must retain this value.
    Value: !Ref OidcProviderOwner
  GitHubEnvironmentSubject:
    Description: Exact environment subject trusted by the infrastructure role.
    Value: !Sub
      - "repo:${GitHubOwner}/${GitHubRepository}:environment:${EnvironmentName}"
      - EnvironmentName: !If [IsDev, web-dev, web-prod]